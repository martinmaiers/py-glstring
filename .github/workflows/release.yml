name: Release to PyPI

# Publishes the `glstring` distribution to PyPI when a GitHub Release is
# published. Uses PyPI Trusted Publishing (OIDC) -- no API tokens are stored.
#
# One-time setup on PyPI (see README/DESIGN release notes):
#   Register a "pending publisher" for project `glstring` with:
#     Owner:      societyforimmunepolymorphism
#     Repository: py-glstring
#     Workflow:   release.yml
#     Environment: pypi
#
# To cut a release: create and publish a GitHub Release on a tag like `v0.1.0`.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment name must match the PyPI trusted-publisher configuration.
    environment:
      name: pypi
      url: https://pypi.org/project/glstring/
    permissions:
      # IMPORTANT: this permission is required for Trusted Publishing (OIDC).
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
